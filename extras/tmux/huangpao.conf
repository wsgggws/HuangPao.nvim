# HuangPao status, terminal selection and popup surfaces; tmux 3.2+.
set -g status-style 'fg=#504a37,bg=#c2a25d'
set -g window-status-style 'fg=#504a37,bg=#c2a25d'
set -g window-status-current-style 'fg=#252219,bg=#b08b47,bold'
set -g window-status-activity-style 'fg=#234861,bg=#c2a25d,underscore'
set -g window-status-bell-style 'fg=#7d2925,bg=#c2a25d,bold'
set -g message-style 'fg=#342f23,bg=#d4b976'
set -g message-command-style 'fg=#683b13,bg=#d4b976'
set -g pane-border-style 'fg=#af9251'
set -g pane-active-border-style 'fg=#683b13'
set -g mode-style 'fg=#d4b976,bg=#252219,bold'
set -g popup-style 'fg=#342f23,bg=#d4b976'
set -g popup-border-style 'fg=#987d48,bg=#d4b976'
